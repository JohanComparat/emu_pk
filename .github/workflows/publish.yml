name: publish

# Trusted publishing (OIDC), not an API token: nothing secret is stored in the
# repository and the workflow can only publish this project.
#
# Run against TestPyPI first with workflow_dispatch, then tag.  The tag path is
# the only one that reaches PyPI proper.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: The wheel must carry its data
        run: |
          python - <<'PY'
          import glob, zipfile
          w = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(w).namelist()
          need = ["emu_pk/data/emu_pk_mlp.npz", "emu_pk/data/class_pk_ratio.npz",
                  "emu_pk/data/validation.json", "emu_pk/py.typed"]
          missing = [n for n in need if n not in names]
          assert not missing, f"{w} is missing {missing}"
          PY
      - name: The tag must match the version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, pathlib, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = re.search(r'^version = "([^"]+)"',
                          pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          assert tag == ver, f"tag {tag!r} but version {ver!r}"
          PY
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
