name: publish

# Trusted publishing (OIDC), not an API token: nothing secret is stored in the
# repository and the workflow can only publish this project.
#
# The trigger is a *published GitHub release*, not a tag push.  Tags get moved
# while a release is being prepared -- `v1.0.0` was repointed several times
# before 1.0.0 went out -- and PyPI refuses to re-upload a version that already
# exists, so a tag-push trigger turns every one of those into a failed run.  A
# release is made once, which is the shape an upload wants.
#
# Creating the release is therefore the step that publishes.  Pushing the tag
# does nothing on its own.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: The metadata must render on PyPI
        # A README that fails to render leaves the project page blank, and PyPI
        # accepts the upload anyway.  Cheaper to find here.
        run: python -m twine check dist/*

      - name: The wheel must carry its data
        run: |
          python - <<'PY'
          import glob, zipfile
          w = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(w).namelist()
          need = ["emu_pk/data/emu_pk_mlp.npz", "emu_pk/data/class_pk_ratio.npz",
                  "emu_pk/data/validation.json", "emu_pk/py.typed"]
          missing = [n for n in need if n not in names]
          assert not missing, f"{w} is missing {missing}"
          print(f"{w}: data present")
          PY

      - name: The tag must match the version
        run: |
          python - <<'PY'
          import os, pathlib, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = re.search(r'^version = "([^"]+)"',
                          pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          assert tag == ver, f"tag {tag!r} but version {ver!r}"
          print(f"tag {tag} matches pyproject {ver}")
          PY

      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
