name: slow

# The `[gen]` install compiles CLASS from source, which is minutes, and the
# tests it enables take minutes more.  Weekly and on demand rather than on
# every push -- but they are the tests that check this package against the
# solver it is distilled from, so they cannot simply not run.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  against-class:
    name: against CLASS
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install with the generator
        run: |
          python -m pip install --upgrade pip
          # CLASS's setup.py runs `make` with an unbounded -j and gets the
          # compiler OOM-killed on a small runner.
          MAKEFLAGS=-j2 pip install -e '.[gen,dev]'
      - name: Run the slow suite
        run: pytest tests/ -q -m slow
      - name: The shipped validation must describe the shipped weights
        run: pytest tests/ -q -k "TestTheShippedWeightsAreTheOnesValidated"
